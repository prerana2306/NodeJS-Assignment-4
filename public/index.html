<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node.js User Registration</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; display: grid; place-items: center; padding: 24px; }
    .container { width: 100%; max-width: 470px; background: white; padding: 32px; border-radius: 16px; box-shadow: 0 12px 35px rgba(15, 23, 42, .10); }
    h1 { margin: 0 0 8px; color: #1d4ed8; font-size: 26px; }
    .subtitle { color: #64748b; margin: 0 0 25px; line-height: 1.5; }
    label { display: block; font-weight: 600; margin: 15px 0 7px; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    input:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px; color: white; background: #2563eb; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #message { margin-top: 18px; padding: 12px; border-radius: 8px; display: none; line-height: 1.5; }
    #message.success { display: block; color: #166534; background: #dcfce7; }
    #message.error { display: block; color: #991b1b; background: #fee2e2; }
    .links { margin-top: 20px; text-align: center; font-size: 13px; }
    a { color: #1d4ed8; }
    .hint { font-size: 12px; color: #64748b; margin-top: 5px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Create Account</h1>
    <p class="subtitle">Register using the form below. All important validation is performed on the Node.js server.</p>

    <form id="registrationForm">
      <label for="name">Full Name</label>
      <input id="name" name="name" type="text" placeholder="Enter your full name" required>

      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" placeholder="example@gmail.com" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Minimum 8 characters" required>
      <div class="hint">Use at least 8 characters.</div>

      <label for="phone">Mobile Number</label>
      <input id="phone" name="phone" type="tel" placeholder="10-digit mobile number" required>

      <button type="submit">Register</button>
    </form>

    <div id="message" role="status"></div>
    <div class="links">
      <a href="/api/registrations" target="_blank">View saved registrations (demo)</a>
      &nbsp;|&nbsp;
      <a href="/api/logs" target="_blank">View server logs</a>
    </div>
  </main>

  <script>
    const form = document.getElementById("registrationForm");
    const messageBox = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      messageBox.className = "";
      messageBox.style.display = "none";

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const result = await response.json();

        messageBox.className = result.success ? "success" : "error";
        messageBox.innerHTML = result.success
          ? result.message
          : result.message + "<br>" + (result.errors || []).join("<br>");

        if (result.success) form.reset();
      } catch (error) {
        messageBox.className = "error";
        messageBox.textContent = "Could not connect to the server. Please try again.";
      }
    });
  </script>
</body>
</html>
